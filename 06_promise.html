<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise</title>
  </head>
  <body>
    <script>
      // callback의 2가지 문제 : 1) 순서보장 x, 2) 예외처리 x
      function f1(callback) {
        return new Promise((resolve, reject) => {
          // 성공시에는
          setTimeout(() => {
            resolve();
          }, 1000); // 처히될 때까지 pending
        });
      }
      function f2(callback) {
        return new Promise((resolve, reject) => {
          // 실패시에는
          reject(new Error("실패함"));
        });
      }

      const p1 = f1();
      const p2 = f2();
      console.log(p1);
      console.log(p2);
      p1.then(() => console.log("성공함 1")).catch(() =>
        console.log("실패함 1"),
      );
      p2.then(() => console.log("성공함 1")).catch(() =>
        console.log("실패함 1"),
      );
    </script>
  </body>
</html>
